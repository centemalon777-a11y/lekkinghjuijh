<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Zenova</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --navy: #0D1B3E;
    --dark-blue: #112D6B;
    --mid-blue: #1A3A8A;
    --light-blue: #E8EDF7;
    --accent-gold: #C9A84C;
    --accent-gold-light: #F5E9C8;
    --white: #FFFFFF;
    --off-white: #F8F9FC;
    --text-muted: #6B7280;
    --text-light: #9CA3AF;
    --border: #E5E8F0;
    --error: #DC2626;
    --success: #16A34A;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--off-white);
    color: var(--navy);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 24px 60px;
    position: relative;
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* Background pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(201,168,76,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 90%, rgba(13,27,62,0.06) 0%, transparent 60%);
    pointer-events: none;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(255,255,255,0.96); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 5%; display: flex; align-items: center; height: 68px;
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .logo-img { width: 40px; height: 40px; object-fit: contain; }
  .logo-text { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--navy); }

  /* CARD */
  .auth-wrapper {
    width: 100%; max-width: 460px;
    margin-top: 68px;
    animation: slideUp 0.5s ease both;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .auth-card {
    background: var(--white);
    border-radius: 24px;
    padding: 44px 40px;
    box-shadow: 0 4px 6px rgba(13,27,62,0.04), 0 20px 48px rgba(13,27,62,0.10);
    border: 1px solid var(--border);
  }

  .auth-header { margin-bottom: 32px; }
  .auth-badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--accent-gold-light); color: #7A5C1E;
    font-size: 12px; font-weight: 600; padding: 5px 12px;
    border-radius: 100px; margin-bottom: 16px; letter-spacing: 0.3px;
  }
  .auth-badge-dot { width: 5px; height: 5px; background: var(--accent-gold); border-radius: 50%; }
  .auth-title {
    font-family: 'Playfair Display', serif;
    font-size: 30px; font-weight: 800;
    color: var(--navy); letter-spacing: -0.8px;
    line-height: 1.2; margin-bottom: 8px;
  }
  .auth-title em { font-style: italic; color: var(--accent-gold); }
  .auth-sub { font-size: 15px; color: var(--text-muted); line-height: 1.6; }

  /* GOOGLE BUTTON */
  .btn-google {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 12px 20px; border-radius: 10px;
    border: 1.5px solid var(--border); background: var(--white);
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; color: var(--navy);
    cursor: pointer; transition: border-color 0.2s, background 0.2s, transform 0.15s;
    margin-bottom: 24px;
  }
  .btn-google:hover { border-color: var(--navy); background: var(--light-blue); transform: translateY(-1px); }
  .google-icon { width: 20px; height: 20px; flex-shrink: 0; }

  /* DIVIDER */
  .divider { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-text { font-size: 13px; color: var(--text-light); font-weight: 500; white-space: nowrap; }

  /* FORM */
  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: 14px; font-weight: 600; color: var(--navy); margin-bottom: 7px; }
  .input-wrap { position: relative; }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%; padding: 12px 16px;
    border: 1.5px solid var(--border); border-radius: 10px;
    font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--navy);
    background: var(--white); outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(13,27,62,0.08); }
  input.error-field { border-color: var(--error); }
  .input-icon {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    color: var(--text-light); cursor: pointer; transition: color 0.2s;
  }
  .input-icon:hover { color: var(--navy); }

  .form-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .remember-wrap { display: flex; align-items: center; gap: 8px; }
  .remember-wrap input[type="checkbox"] { accent-color: var(--navy); width: 16px; height: 16px; }
  .remember-wrap label { font-size: 14px; font-weight: 400; color: var(--text-muted); margin: 0; cursor: pointer; }
  .forgot-link { font-size: 14px; font-weight: 500; color: var(--navy); text-decoration: none; }
  .forgot-link:hover { text-decoration: underline; }

  /* SUBMIT */
  .btn-submit {
    width: 100%; padding: 13px 20px; border-radius: 10px;
    background: var(--navy); color: var(--white); border: none;
    font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 600;
    cursor: pointer; transition: background 0.2s, transform 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 20px;
  }
  .btn-submit:hover:not(:disabled) { background: var(--dark-blue); transform: translateY(-1px); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* SPINNER */
  .spinner {
    width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white; border-radius: 50%;
    animation: spin 0.7s linear infinite; display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-submit.loading .spinner { display: block; }
  .btn-submit.loading .btn-text { display: none; }

  /* MESSAGES */
  .msg-box {
    padding: 12px 16px; border-radius: 10px;
    font-size: 14px; font-weight: 500; margin-bottom: 18px;
    display: none; align-items: center; gap: 10px;
  }
  .msg-box.error { background: #FEF2F2; color: var(--error); border: 1px solid #FCA5A5; display: flex; }
  .msg-box.success { background: #F0FDF4; color: var(--success); border: 1px solid #86EFAC; display: flex; }

  /* FOOTER */
  .auth-footer { text-align: center; font-size: 14px; color: var(--text-muted); }
  .auth-footer a { color: var(--navy); font-weight: 600; text-decoration: none; }
  .auth-footer a:hover { text-decoration: underline; }

  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; color: var(--text-muted); text-decoration: none;
    margin-bottom: 24px; transition: color 0.2s;
  }
  .back-link:hover { color: var(--navy); }

  @media (max-width: 500px) {
    .auth-card { padding: 32px 24px; }
    .auth-title { font-size: 26px; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="1.png" class="logo-img" alt="Zenova Logo">
    <span class="logo-text">Zenova</span>
  </a>
</nav>

<div class="auth-wrapper">
  <a href="index.html" class="back-link">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Back to home
  </a>

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-badge">
        <span class="auth-badge-dot"></span>
        Welcome back
      </div>
      <h1 class="auth-title">Log in to <em>Zenova</em></h1>
      <p class="auth-sub">Continue your JAMB prep journey. Your progress awaits.</p>
    </div>

    <!-- Google Sign In -->
    <button class="btn-google" id="googleBtn" onclick="signInWithGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">or sign in with email</span>
      <div class="divider-line"></div>
    </div>

    <div class="msg-box" id="msgBox"></div>

    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
        <span class="input-icon" onclick="togglePassword('password', this)" title="Show/hide password">
          <svg id="eye-login" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
      </div>
    </div>

    <div class="form-row">
      <label class="remember-wrap">
        <input type="checkbox" id="remember">
        <span>Remember me</span>
      </label>
      <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
    </div>

    <button class="btn-submit" id="loginBtn" onclick="handleLogin()">
      <span class="btn-text">Sign In</span>
      <div class="spinner"></div>
    </button>

    <p class="auth-footer">
      Don't have an account? <a href="signup.html">Create one free</a>
    </p>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, setPersistence, browserLocalPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBWYdeKlijVJUHUjzcCoPgZDumsgJFMDaw",
    authDomain: "zenova-4342f.firebaseapp.com",
    databaseURL: "https://zenova-4342f-default-rtdb.firebaseio.com",
    projectId: "zenova-4342f",
    storageBucket: "zenova-4342f.firebasestorage.app",
    messagingSenderId: "132378238032",
    appId: "1:132378238032:web:6fe0055d9d5b50b3050555"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  function showMsg(text, type) {
    const box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg-box ' + type;
  }

  function setLoading(loading) {
    const btn = document.getElementById('loginBtn');
    btn.disabled = loading;
    btn.classList.toggle('loading', loading);
  }

  window.handleLogin = async function() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;

    if (!email || !password) { showMsg('Please fill in all fields.', 'error'); return; }

    setLoading(true);
    try {
      const persistence = remember ? browserLocalPersistence : browserSessionPersistence;
      await setPersistence(auth, persistence);
      await signInWithEmailAndPassword(auth, email, password);
      showMsg('Login successful! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'plans.html', 1200);
    } catch (err) {
      const msgs = {
        'auth/user-not-found': 'No account found with this email.',
        'auth/wrong-password': 'Incorrect password. Please try again.',
        'auth/invalid-email': 'Please enter a valid email address.',
        'auth/too-many-requests': 'Too many attempts. Please try again later.',
        'auth/invalid-credential': 'Invalid email or password.',
      };
      showMsg(msgs[err.code] || 'Something went wrong. Please try again.', 'error');
    } finally {
      setLoading(false);
    }
  };

  window.signInWithGoogle = async function() {
    const btn = document.getElementById('googleBtn');
    btn.disabled = true;
    try {
      await signInWithPopup(auth, provider);
      showMsg('Login successful! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'plans.html', 1200);
    } catch (err) {
      if (err.code !== 'auth/popup-closed-by-user') {
        showMsg('Google sign-in failed. Please try again.', 'error');
      }
    } finally {
      btn.disabled = false;
    }
  };

  window.togglePassword = function(id, icon) {
    const input = document.getElementById(id);
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    icon.innerHTML = isText
      ? `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
      : `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
  };

  // Enter key submit
  document.addEventListener('keydown', e => { if (e.key === 'Enter') window.handleLogin(); });
</script>
</body>
</html>
